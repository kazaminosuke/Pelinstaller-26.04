name: UI tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12"]
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: for f in install.sh lib/*.sh ui/*.sh installers/*.sh tests/*.sh; do bash -n "$f"; done
      - name: Screen-transition and input-validation tests (${{ matrix.image }})
        run: tests/run.sh "${{ matrix.image }}"
